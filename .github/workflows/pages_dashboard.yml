name: Pages Dashboard

# Publishes the generated `dashboard.html` as this repo's GitHub Pages index:
# https://pyautolabs.github.io/PyAutoInsight/
#
# The page is rendered by `bin/pyauto-insight board` and kept fresh by
# dashboard_refresh.yml. This workflow only publishes it, with badge.json (the
# one-line headline other boards read) and state.json (the organ-cockpit feed,
# contract PyAutoBrain/board/state_schema.json) beside it, and nothing else:
# no summary, receipt or snapshot is copied into the site, and every evidence
# link points at the project repo at the captured commit. (Eyes/Cortex pattern.)

on:
  push:
    branches: [main]
    paths:
      - "dashboard.html"
      - "badge.json"
      - "state.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: true creates the Pages site on first run where the token
      # may; otherwise enable Pages (source: GitHub Actions) once by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage the dashboard as the site index
        run: |
          mkdir -p _site
          cp dashboard.html _site/index.html
          cp badge.json _site/badge.json
          cp state.json _site/state.json
      # The contract is owned by the Brain (board/_state.py); the Insight only
      # emits it. A feed the cockpit cannot read fails loudly here.
      - uses: actions/checkout@v4
        with:
          repository: PyAutoLabs/PyAutoBrain
          path: PyAutoBrain
      - name: Validate the cockpit feed against the Brain contract
        run: python3 PyAutoBrain/board/_state.py _site/state.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
